spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ergene_db}
    username: ${SPRING_DATASOURCE_USERNAME:ergene_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ergene_pass}
  jpa:
    hibernate:
      ddl-auto: update

fhir:
  server-url: ${FHIR_SERVER_URL:http://localhost:8081/fhir}

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}

storage:
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}