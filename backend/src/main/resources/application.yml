spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}
  jackson:
    property-naming-strategy: SNAKE_CASE
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ergene_db}
    username: ${SPRING_DATASOURCE_USERNAME:ergene_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ergene_pass}
  jpa:
    hibernate:
      ddl-auto: update

fhir:
  server-url: ${FHIR_SERVER_URL:http://localhost:8081/fhir}

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}

storage:
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://10.0.2.2:8080,https://ieee-hackathon-omega.vercel.app}